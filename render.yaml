services:
  - type: web
    name: fertilizer-inventory-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && pnpm install && pnpm --filter=@fertilizer/shared build && pnpm --filter=api build
    startCommand: pnpm --filter=api start:prod
    healthCheckPath: /api/v1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
